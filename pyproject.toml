[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmesh"
version = "0.1.0"
description = "AI-powered codebase intelligence and software architecture platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["engines*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]



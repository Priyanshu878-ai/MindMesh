services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindmesh}
      POSTGRES_USER: ${POSTGRES_USER:-mindmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindmesh_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindmesh} -d ${POSTGRES_DB:-mindmesh}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: mindmesh_postgres_data

# A generic, single database configuration for apps/api directory.

[alembic]
script_location = %(here)s/../../alembic
prepend_sys_path = %(here)s %(here)s/../..
timezone = UTC
truncate_slug_length = 40
version_locations = %(here)s/../../alembic/versions
path_separator = os
output_encoding = utf-8
sqlalchemy.url = postgresql+psycopg://mindmesh:mindmesh_secret@localhost:5432/mindmesh

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
